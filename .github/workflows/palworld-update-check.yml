name: Palworld Update Notifier

on:
  schedule:
    - cron: '*/15 * * * *'   # 頻繁に起動を試みる（GitHub都合で間引かれる分は下のループで補う）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: palworld-check
  cancel-in-progress: false   # 実行中に次の起動が来たら待たせる（連続監視になり穴が埋まる）

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 5分おきに約45分チェック＆Discord通知
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -uo pipefail
          APPID=2394010
          STATE_FILE=state/last_buildid.txt
          LOOPS=10          # チェック回数
          INTERVAL=300      # 間隔(秒)  300=5分  → 約45分カバー

          mkdir -p state

          for i in $(seq 1 "$LOOPS"); do
            echo "--- チェック $i/$LOOPS ---"

            JSON=$(curl -fsSL --max-time 30 "https://api.steamcmd.net/v1/info/${APPID}") || {
              echo "API取得失敗。スキップ"; [ "$i" -lt "$LOOPS" ] && sleep "$INTERVAL"; continue;
            }

            NEW_BUILD=$(echo "$JSON" | jq -r ".data.\"${APPID}\".depots.branches.public.buildid // empty")
            TIME_UPDATED=$(echo "$JSON" | jq -r ".data.\"${APPID}\".depots.branches.public.timeupdated // empty")

            if [ -z "$NEW_BUILD" ]; then
              echo "ビルドID取得できず。スキップ"; [ "$i" -lt "$LOOPS" ] && sleep "$INTERVAL"; continue;
            fi

            # 初回は記録だけ（通知しない）
            if [ ! -f "$STATE_FILE" ]; then
              echo "初回。現在のビルドID($NEW_BUILD)を記録"; echo "$NEW_BUILD" > "$STATE_FILE"
              [ "$i" -lt "$LOOPS" ] && sleep "$INTERVAL"; continue;
            fi

            OLD_BUILD=$(cat "$STATE_FILE")
            if [ "$NEW_BUILD" = "$OLD_BUILD" ]; then
              echo "変化なし ($NEW_BUILD)"; [ "$i" -lt "$LOOPS" ] && sleep "$INTERVAL"; continue;
            fi

            echo "アプデ検知: $OLD_BUILD -> $NEW_BUILD"

            if [ -n "$TIME_UPDATED" ]; then
              WHEN=$(TZ=Asia/Tokyo date -d "@$TIME_UPDATED" '+%Y-%m-%d %H:%M JST')
            else
              WHEN="不明"
            fi

            CONTENT=$(printf '@here\n🆕 **パルワールド専用サーバーのアップデートが来ました！**\nSteam配信時刻: %s\nビルドID: `%s` → `%s`\nサーバーの更新をお願いします 🛠️' "$WHEN" "$OLD_BUILD" "$NEW_BUILD")

            if jq -n --arg content "$CONTENT" --arg name "Palworld Update Notifier" \
                 '{content:$content, username:$name, allowed_mentions:{parse:["everyone"]}}' \
                 | curl -fsSL --max-time 30 -X POST -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"; then
              echo "通知成功。記録を更新"; echo "$NEW_BUILD" > "$STATE_FILE"
            else
              echo "Discord通知に失敗。記録は更新せず次回リトライ"
            fi

            [ "$i" -lt "$LOOPS" ] && sleep "$INTERVAL"
          done

      - name: 記録の変更を保存
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update last buildid"
            git push
          else
            echo "コミット不要"
          fi
